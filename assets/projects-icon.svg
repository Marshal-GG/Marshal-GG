<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="projectsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#a855f7" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1">
        <animate attributeName="stop-color" values="#ec4899;#a855f7;#ec4899" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <!-- 2x2 grid: each tile brightens in turn -->
  <rect x="4" y="4" width="6.5" height="6.5" rx="2" fill="none" stroke="url(#projectsGrad)" stroke-width="2">
    <animate attributeName="opacity" values="1;0.35;0.35;0.35;1" dur="2s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect x="13.5" y="4" width="6.5" height="6.5" rx="2" fill="none" stroke="url(#projectsGrad)" stroke-width="2">
    <animate attributeName="opacity" values="0.35;1;0.35;0.35;0.35" dur="2s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2" fill="none" stroke="url(#projectsGrad)" stroke-width="2">
    <animate attributeName="opacity" values="0.35;0.35;1;0.35;0.35" dur="2s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect x="4" y="13.5" width="6.5" height="6.5" rx="2" fill="none" stroke="url(#projectsGrad)" stroke-width="2">
    <animate attributeName="opacity" values="0.35;0.35;0.35;1;0.35" dur="2s" begin="0s" repeatCount="indefinite"/>
  </rect>
</svg>
