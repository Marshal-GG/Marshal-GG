<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Image Captioning">
<title>Image Captioning</title>
<defs>
  <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#34d399;#22d3ee" dur="4s" repeatCount="indefinite"/></stop><stop offset="100%" stop-color="#34d399"><animate attributeName="stop-color" values="#34d399;#22d3ee;#34d399" dur="4s" repeatCount="indefinite"/></stop></linearGradient>
  <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#34d399"/></linearGradient>
  <radialGradient id="glowA" cx="12%" cy="90%" r="55%"><stop offset="0%" stop-color="#34d399" stop-opacity="0.22"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx="88%" cy="8%" r="55%"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
  <clipPath id="round"><rect x="0" y="0" width="900" height="240" rx="18"/></clipPath>
</defs>
<g clip-path="url(#round)">
  <rect width="900" height="240" fill="#061219"/>
  <rect width="900" height="240" fill="url(#glowA)"/>
  <rect width="900" height="240" fill="url(#glowB)"/>
  <rect width="900" height="240" fill="url(#dots)"/>
</g>
<rect x="0.75" y="0.75" width="898.5" height="238.5" rx="17.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="44" y="46" width="201" height="24" rx="12" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
<text x="144.5" y="62" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.6" fill="#99f6e4">COMPUTER VISION + NLP</text>
<text x="44" y="122" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Image <tspan fill="url(#ink)">Captioning</tspan></text>
