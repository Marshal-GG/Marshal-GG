<svg xmlns="http://www.w3.org/2000/svg" width="440" height="146" viewBox="0 0 440 146" role="img" aria-label="Omni Bridge Translator">
<title>Omni Bridge Translator</title>
<defs>

    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#a855f7" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#a855f7;#ec4899" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
</defs>
